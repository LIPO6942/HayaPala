<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Dark Carbon Background Gradient -->
    <radialGradient id="iconBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#141A24" />
      <stop offset="60%" stop-color="#0A0D14" />
      <stop offset="100%" stop-color="#05070A" />
    </radialGradient>

    <!-- Carbon Fiber Head Gradient -->
    <linearGradient id="palaCarbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#28303E" />
      <stop offset="50%" stop-color="#19202B" />
      <stop offset="100%" stop-color="#0E131A" />
    </linearGradient>

    <!-- Neon Volt & Cyan Rim Light -->
    <linearGradient id="neonVoltCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CCFF00" />
      <stop offset="50%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>

    <!-- Ball Shading -->
    <radialGradient id="ballVolt" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#F7FF85" />
      <stop offset="35%" stop-color="#D8FF00" />
      <stop offset="70%" stop-color="#AEEA00" />
      <stop offset="100%" stop-color="#648B00" />
    </radialGradient>

    <!-- Carbon Fiber Micro-Weave Pattern -->
    <pattern id="carbonWeave" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#141A23" />
      <polygon points="0,0 3,0 0,3" fill="#1E2734" opacity="0.6" />
      <polygon points="3,3 6,3 3,6" fill="#1E2734" opacity="0.6" />
      <polygon points="3,0 6,0 6,3" fill="#2A3546" opacity="0.4" />
      <polygon points="0,3 3,3 0,6" fill="#2A3546" opacity="0.4" />
    </pattern>

    <!-- Neon Glow Filter -->
    <filter id="palaNeonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle App Icon Container (iOS / Android Style) -->
  <rect x="6" y="6" width="188" height="188" rx="46" fill="url(#iconBg)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Aerodynamic Background Radar Grid Lines (Subtle Futuristic Sports Tech) -->
  <circle cx="100" cy="95" r="75" fill="none" stroke="rgba(0, 245, 212, 0.08)" stroke-width="1" stroke-dasharray="3 3" />
  <circle cx="100" cy="95" r="55" fill="none" stroke="rgba(204, 255, 0, 0.06)" stroke-width="1" />
  <line x1="25" y1="95" x2="175" y2="95" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
  <line x1="100" y1="20" x2="100" y2="170" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />

  <!-- Padel Pala Grip / Handle (Bottom angled) -->
  <g transform="translate(100, 100) rotate(-32) translate(-100, -100)">
    <!-- Grip Wrap -->
    <rect x="91" y="128" width="18" height="52" rx="5" fill="#0D1117" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <!-- Grip Diagonal Overgrip Tape Lines -->
    <line x1="91" y1="138" x2="109" y2="144" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.2" />
    <line x1="91" y1="148" x2="109" y2="154" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.2" />
    <line x1="91" y1="158" x2="109" y2="164" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.2" />
    <line x1="91" y1="168" x2="109" y2="174" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.2" />
    <!-- Butt Cap / Wrist Strap ring -->
    <rect x="88" y="177" width="24" height="6" rx="3" fill="#CCFF00" />
    
    <!-- Aerodynamic Throat / Bridge (Heart of the Padel Racket) -->
    <path d="M 88,128 L 82,108 Q 100,118 118,108 L 112,128 Z" fill="#141B24" stroke="rgba(0, 245, 212, 0.4)" stroke-width="1.5" />
    <polygon points="94,116 106,116 100,125" fill="#0A0D14" stroke="#00F5D4" stroke-width="1" opacity="0.8" />

    <!-- Padel Racket Head Silhouette (Teardrop / Diamond Hybrid Pro Shape) -->
    <!-- Outer Glow Rim -->
    <path d="M 100,26 C 62,26 44,52 46,84 C 48,104 68,118 84,118 Q 100,122 116,118 C 132,118 152,104 154,84 C 156,52 138,26 100,26 Z" 
          fill="url(#palaCarbon)" 
          stroke="url(#neonVoltCyan)" 
          stroke-width="3" 
          filter="url(#palaNeonGlow)" />

    <!-- Carbon Fiber Surface Texture Overlay -->
    <path d="M 100,28 C 64,28 47,53 49,83 C 51,102 69,115 85,115 Q 100,119 115,115 C 131,115 149,102 151,83 C 153,53 136,28 100,28 Z" 
          fill="url(#carbonWeave)" 
          opacity="0.85" />

    <!-- Aerodynamic Drilled Holes Pattern (Signature Padel Racket Perforations) -->
    <g fill="#07090D" stroke="rgba(0, 245, 212, 0.35)" stroke-width="0.8">
      <!-- Arc 1 (Outer perimeter holes) -->
      <circle cx="68" cy="56" r="3.2" />
      <circle cx="82" cy="46" r="3.2" />
      <circle cx="100" cy="42" r="3.2" />
      <circle cx="118" cy="46" r="3.2" />
      <circle cx="132" cy="56" r="3.2" />

      <!-- Arc 2 -->
      <circle cx="62" cy="72" r="3.4" />
      <circle cx="76" cy="62" r="3.4" />
      <circle cx="124" cy="62" r="3.4" />
      <circle cx="138" cy="72" r="3.4" />

      <!-- Arc 3 (Sweet spot surrounding) -->
      <circle cx="62" cy="88" r="3.6" />
      <circle cx="74" cy="80" r="3.6" />
      <circle cx="126" cy="80" r="3.6" />
      <circle cx="138" cy="88" r="3.6" />

      <!-- Arc 4 (Bottom throat holes) -->
      <circle cx="70" cy="102" r="3.2" />
      <circle cx="84" cy="98" r="3.2" />
      <circle cx="116" cy="98" r="3.2" />
      <circle cx="130" cy="102" r="3.2" />
      <circle cx="100" cy="105" r="3.2" />
    </g>

    <!-- Futuristic Chevron Decal on Pala Surface -->
    <path d="M 85,76 L 100,60 L 115,76" fill="none" stroke="#CCFF00" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- The Real Fuzzy Padel Ball at the Sweet Spot / Impact Point -->
  <g transform="translate(108, 88)">
    <!-- Ball Drop Shadow on the Pala Face -->
    <ellipse cx="0" cy="8" rx="26" ry="18" fill="#000000" opacity="0.65" filter="url(#palaNeonGlow)" />
    
    <!-- Outer Micro-Hair Bristles on Ball Rim (Fuzzy wool felt fibers) -->
    <circle cx="0" cy="0" r="24.5" fill="none" stroke="#E6FF4D" stroke-width="1.8" stroke-dasharray="0.8 2.4" opacity="0.85" stroke-linecap="round" />
    <circle cx="0" cy="0" r="25.2" fill="none" stroke="#CCFF00" stroke-width="1.2" stroke-dasharray="0.5 3.0" opacity="0.7" stroke-linecap="round" />

    <!-- Main Ball Sphere -->
    <circle cx="0" cy="0" r="23" fill="url(#ballVolt)" />

    <!-- Vulcanized Rubber Seam Ribs -->
    <path d="M -14,-14 C -3,-6 -3,14 -14,18" fill="none" stroke="#4B6600" stroke-width="3" opacity="0.5" />
    <path d="M -14,-14 C -3,-6 -3,14 -14,18" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9" />

    <path d="M 14,-14 C 3,-6 3,14 14,18" fill="none" stroke="#4B6600" stroke-width="3" opacity="0.5" />
    <path d="M 14,-14 C 3,-6 3,14 14,18" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9" />

    <!-- Velvet Felt Specular Highlight -->
    <ellipse cx="-7" cy="-9" rx="8" ry="4" transform="rotate(-30 -7 -9)" fill="#FFFFFF" opacity="0.4" />
  </g>

  <!-- Dynamic Energy Glow Flash (Impact Moment) -->
  <circle cx="108" cy="88" r="32" fill="none" stroke="rgba(204, 255, 0, 0.4)" stroke-width="1.5" stroke-dasharray="4 6" />
</svg>
